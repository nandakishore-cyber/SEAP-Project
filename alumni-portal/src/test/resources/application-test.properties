# Test Profile Properties
spring.application.name=alumni-portal-test

# ==================== H2 In-Memory for Tests ====================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ==================== JWT (shorter expiry for tests) ====================
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0aW5nLW9ubHktZG8tbm90LXVzZS1pbi1wcm9k
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=7200000

# ==================== LOGGING ====================
logging.level.com.alumni.portal=WARN
logging.level.org.springframework.security=WARN
