<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Login | AlumniConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page" data-role="ROLE_ALUMNI" data-role-label="Alumni">
    <div class="background-animation"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <nav class="navbar"><div class="container nav-container">
        <a class="logo" href="index.html">Alumni<span>Connect</span></a>
        <a class="btn btn-outline btn-sm" href="index.html">Change account type</a>
    </div></nav>
    <main class="container auth-container">
        <div class="auth-card glass-panel">
            <div class="auth-header"><h2><span class="role-name">Alumni</span> portal</h2><p>Sign in or create your AlumniConnect account.</p></div>
            <div class="auth-tabs">
                <button class="tab-btn active" type="button" data-tab="login">Login</button>
                <button class="tab-btn" type="button" data-tab="register">Create account</button>
            </div>
            <form id="loginForm" class="auth-form active">
                <div class="form-group"><label for="loginEmail">Email Address</label><input type="email" id="loginEmail" required autocomplete="email" placeholder="you@college.edu"></div>
                <div class="form-group"><label for="loginPassword">Password</label><input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••"></div>
                <div id="loginError" class="error-msg" role="alert"></div>
                <button type="submit" class="btn btn-primary btn-block"><span>Sign In</span><div class="loader hidden"></div></button>
            </form>
            <form id="registerForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group"><label for="regFirstName">First Name</label><input type="text" id="regFirstName" required autocomplete="given-name" placeholder="John"></div>
                    <div class="form-group"><label for="regLastName">Last Name</label><input type="text" id="regLastName" required autocomplete="family-name" placeholder="Doe"></div>
                </div>
                <div class="form-group"><label for="regEmail">Email Address</label><input type="email" id="regEmail" required autocomplete="email" placeholder="you@college.edu"></div>
                <div class="form-group"><label for="regPassword">Password</label><input type="password" id="regPassword" required minlength="8" autocomplete="new-password" placeholder="••••••••"></div>
                <div class="form-row">
                    <div class="form-group"><label for="regCollege">College Name</label><input id="regCollege" required placeholder="Your college"></div>
                    <div class="form-group"><label for="regDepartment">Department</label><input id="regDepartment" required placeholder="Computer Science"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="regDegree">Degree</label><input id="regDegree" required placeholder="B.Tech"></div>
                    <div class="form-group"><label for="regGraduationYear">Graduation Year</label><input id="regGraduationYear" type="number" min="1950" max="2100" required placeholder="2020"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="regCompany">Current Company</label><input id="regCompany" placeholder="Company name"></div>
                    <div class="form-group"><label for="regDesignation">Current Designation</label><input id="regDesignation" placeholder="Software Engineer"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="regExperience">Years of Experience</label><input id="regExperience" type="number" min="0" required value="0"></div>
                    <div class="form-group"><label for="regSkills">Professional Skills</label><input id="regSkills" required placeholder="Java, React, leadership"></div>
                </div>
                <div id="regError" class="error-msg" role="alert"></div>
                <button type="submit" class="btn btn-primary btn-block"><span>Create Account</span><div class="loader hidden"></div></button>
            </form>
        </div>
        <div class="hero-text"><h2>Stay connected to your <span>college story.</span></h2><p>Build meaningful connections and make your experience part of a verified alumni ecosystem.</p></div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
