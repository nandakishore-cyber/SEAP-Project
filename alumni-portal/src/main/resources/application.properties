# Application Properties - Development Profile
spring.application.name=alumni-portal

# ==================== DATABASE (H2 for dev) ====================
spring.datasource.url=jdbc:h2:file:./data/alumnidb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ==================== JWT ====================
app.jwt.secret=YWx1bW5pLXBvcnRhbC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yMDI0LXNlY3VyZQ==
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ==================== SWAGGER ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==================== LOGGING ====================
logging.level.com.alumni.portal=DEBUG
logging.level.org.springframework.security=DEBUG
